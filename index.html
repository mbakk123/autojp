    <style amp-custom>
      html {

      body {

      .flip-button {
        padding: 10px 20px;
        font-size: 16px;
        font-family: "Matrix Regular Small Caps", sans-serif;
        background: linear-gradient(
          135deg,
          #111 0%,
          #222 40%,
          #222 50%,
          #222 60%,
          #111 100%

        border-radius: 8px;
        cursor: pointer;
        color: rgb(255 255 255);

        z-index: 20;

      .card-scene {
        width: 470px;
        perspective: 1200px;
        margin: 50px 0;
        position: relative;
        z-index: 10;
      }

      .card-flipper {
        position: relative;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }

      .card-flipper.is-flipped {
        transform: rotateY(180deg);
      }

      .card-face-front {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      .card-face-back {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: rotateY(180deg);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        box-sizing: border-box;
        background: linear-gradient(
          270deg,
          #003957 0%,
          #1486ff 21%,
          #005667 33%,
          #034e65 44%,
          #0999c5 60%,
          #025784 73%,
          #1489ff 85%,
          #0276db 100%
        );
        padding: 12px;
        display: block;
      }

      .card-face-back amp-img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 10px;
      }

      .ygo-card-container {
        width: 100%;
        padding: 14px;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        box-sizing: border-box;

        background:
          radial-gradient(
            circle at top left,
            rgba(0, 174, 255, 0.25) 0%,
            transparent 40%
          ),
          linear-gradient(
            135deg,
            #111111 0%,
            #1a1a1a 35%,
            #252525 70%,
            #111111 100%
          );
        animation: goldPulse 2s infinite;
        border: 1px solid rgba(0, 179, 255, 0.35);

        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.4),
          inset 0 1px 1px rgba(255, 255, 255, 0.08);
      }

      /* Glow emas di sudut */
      .ygo-card-container::after {
        content: "";
        position: absolute;
        top: -80px;
        right: -80px;
        width: 180px;
        height: 180px;
        background: radial-gradient(
          circle,
          rgba(0, 166, 255, 0.35),
          transparent 70%
        );
        pointer-events: none;
      }

      /* Shine effect */
      .ygo-card-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: -150%;
        width: 50%;
        height: 100%;

        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );

        transform: skewX(-25deg);
        animation: shine 5s infinite;
      }

      @keyframes shine {
        0% {
          left: -150%;
        }
        30% {
          left: 150%;
        }
        100% {
          left: 150%;
        }
      }

      @keyframes card-shine {
        0% {
          left: -150px;
        }

        25% {
          left: 110%;
        }

        100% {
          left: 110%;
        }
      }

      @keyframes holo-shine {
        0% {
          background-position: 100% 100%;
        }

        50% {
          background-position: 0% 0%;
        }

        100% {
          background-position: 100% 100%;
        }
      }

      @keyframes goldPulse {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(0, 187, 255, 0.3);
        }
        50% {
          box-shadow: 0 0 25px rgba(0, 166, 255, 0.7);
        }
      }
      .ygo-card-inner {
        background: #2c2c2c;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #14a1ff;
        position: relative;
        z-index: 1;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: url("https://i.postimg.cc/T2cyWW1g/giphy.gif") no-repeat
          center center;
        padding: 10px 15px;
        border-bottom: 2px solid #477ba8;
        box-shadow:
          inset 0 2px 2px rgba(20, 169, 255, 0.594),
          inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      }

      .card-name {
        font-family: "Matrix Regular Small Caps", sans-serif;
        font-size: 28px;
        /* Kita lebarkan background agar bisa digerakkan */
        background: linear-gradient(
          120deg,
          #4eb5ff 30%,
          #c3d4ff 50%,
          #003d83 70%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 600;
        letter-spacing: 1px;
        /* Jalankan animasi sweep */
        animation: shine 3s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .card-attribute {
        width: 40px;
        height: 40px;
        background: radial-gradient(circle, #008fff, #009eff);
        border: 2px solid #009eff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Arial Black", sans-serif;
        font-size: 18px;
        color: #222;
        text-shadow: 1px 1px 1px white;
        box-shadow:
          inset 0 0 5px rgba(0, 0, 0, 0.7),
          0 0 5px white;
        flex-shrink: 0;
      }

      .card-level {
        background: url("https://i.postimg.cc/T2cyWW1g/giphy.gif") no-repeat
          center center;
        padding: 5px 15px 8px 15px;
        box-shadow:
          inset 0 2px 2px rgba(20, 181, 255, 0.594),
          inset 0 -2px 3px rgba(0, 0, 0, 0.4);
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .star {
        display: inline-block;
        width: 20px;
        height: 20px;
        background: radial-gradient(circle at 50% 30%, #eeff50, #000000 70%);
        border-radius: 50%;
        margin-left: 3px;
        filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.6));
        position: relative;
      }

      .star::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 40% 30%, #fcff50, #f3ff50 70%);
        clip-path: polygon(
          50% 0%,
          65% 40%,
          100% 40%,
          75% 65%,
          85% 100%,
          50% 80%,
          15% 100%,
          25% 65%,
          0% 40%,
          35% 40%
        );
        transform: scale(0.9);
      }

      .rating-count {
        font-family: "Matrix Regular Small Caps", sans-serif;
        font-size: 16px;
        font-weight: bold;
        color: #f0ff50;
        margin-left: 10px;
        padding: 3px 10px;
        border: 1px solid #f0ff50;
        border-radius: 50px;
        background: rgba(0, 0, 0, 0.5);
        box-shadow: inset 0 0 10px rgba(0, 140, 255, 0.3);
        /* Animasi kedip lembut */
        animation: ratingPulse 1.5s infinite ease-in-out;
      }

      @keyframes ratingPulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 5px #14a9ff;
        }
        50% {
          opacity: 0.6;
          box-shadow: 0 0 15px #1489ff;
        }
      }
      .card-image-box {
        padding: 8px;
        background: #2c2c2c;
      }
      .card-image-box {
        padding: 8px;
        background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
        position: relative;
        overflow: hidden;
      }

      /* efek shine jalan */
      .card-image-box::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -60%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          120deg,
          transparent 40%,
          #1491ff,
          transparent 60%
        );
        transform: rotate(25deg);
        animation: shineMove 2s linear infinite;
      }

      /* animasi */
      @keyframes shineMove {
        0% {
          transform: translateX(-100%) rotate(25deg);
        }
        100% {
          transform: translateX(100%) rotate(25deg);
        }
      }

      .card-image-placeholder {
        width: 100%;
        overflow: hidden;
        border-radius: 5px;
        position: relative;
        border-style: solid;
        border-width: 6px;
        background: url("https://i.postimg.cc/T2cyWW1g/giphy.gif") no-repeat
          center center;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        box-sizing: border-box;
      }

      .card-type {
        background: url("https://i.postimg.cc/T2cyWW1g/giphy.gif") no-repeat
          center center;
        padding: 5px 15px;
        border-top: 2px solid #4778a8;
        border-bottom: 2px solid #476da7;
      }

      .type-text {
        font-family: "Matrix Regular Small Caps", sans-serif;
        font-size: 14px;
        font-weight: 800;
        color: #d3d3d3;
      }

      .card-body {
        background: #000000 url("https://i.postimg.cc/T2cyWW1g/giphy.gif")
          no-repeat center center;
        padding: 15px;
        text-align: left;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
      }

      .card-description {
        font-family: "EB Garamond", serif;
        font-size: 15px;
        color: #e8f4ff;
        line-height: 1.4;
        font-style: italic;
        margin-bottom: 8px;
      }

      .card-description strong {
        font-style: normal;
        font-weight: bold;
        color: #4eb5ff;
      }

      .card-cta-button {
        display: block;
        width: 80%;
        margin: 15px auto 10px auto;
        padding: 12px;
        /* Background diperlebar untuk animasi flow */
        background: linear-gradient(
          270deg,
          #1a3e7d,
          #14a1ff,
          #56aaff,
          #0088ff,
          #1c334b
        );
        background-size: 400% 400%;
        color: #fff;
        font-family: "Matrix Regular Small Caps", sans-serif;
        font-size: 20px; /* Sedikit diperbesar */
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 86, 215, 0.4);
        cursor: pointer;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        position: relative;
        overflow: hidden;
        /* Animasi background mengalir */
        animation:
          goldFlow 3s infinite linear,
          buttonPulse 2s infinite;
        transition: all 0.3s ease;
      }

      /* Animasi mengalirkan warna emas dan cahaya putih */
      @keyframes goldFlow {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      /* Animasi denyut halus agar tombol terlihat "hidup" */
      @keyframes buttonPulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 10px rgba(0, 125, 215, 0.4);
        }
        50% {
          transform: scale(1.03);
          box-shadow: 0 0 25px rgba(0, 118, 215, 0.7);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 10px rgba(0, 133, 215, 0.4);
        }
      }

      .card-cta-button:hover {
        background: #fff;
        color: #2a69c2;
        transform: translateY(-3px) scale(1.05);
        box-shadow:
          0 10px 20px rgba(0, 0, 0, 0.6),
          0 0 30px #1491ff;
        letter-spacing: 2px; /* Teks merenggang sedikit saat hover */
      }

      .card-footer {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 10px 15px;
        background: url("https://i.postimg.cc/T2cyWW1g/giphy.gif") no-repeat
          center center;
        border-top: 2px solid #00a2ff;
        padding-right: 50px;
        box-shadow:
          inset 0 2px 2px rgba(20, 153, 255, 0.594),
          inset 0 -2px 3px rgba(0, 0, 0, 0.4);
      }

      .stats {
        font-family: "Matrix Regular Small Caps", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: #000;
        text-shadow: 1px 1px 1px rgba(20, 145, 255, 0.594);
        margin-left: 25px;
      }

      @media (max-width: 480px) {
        body {
          padding: 10px;
          align-items: center;
          min-height: auto;
        }

        .flip-button {
          margin-top: 5px;
          margin-bottom: 2px;
        }

        .card-scene {
          width: 100%;
          margin: 15px 0;
        }

        .ygo-card-container {
          width: 100%;
          padding: 8px;
          margin: 0;
        }

        .card-face-back {
          padding: 8px;
        }

        .card-face-back amp-img {
          border-radius: 10px;
        }

        .card-name {
          font-size: 22px;
        }

        .card-attribute {
          width: 35px;
          height: 35px;
          font-size: 16px;
        }

        .star {
          width: 16px;
          height: 16px;
          margin-left: 2px;
        }

        .rating-count {
          font-size: 14px;
          margin-left: 5px;
        }

        .card-image-box {
          padding: 5px;
        }

        .card-description {
          font-size: 14px;
        }

        .card-body {
          padding: 12px;
        }

        .card-cta-button {
          font-size: 16px;
          padding: 10px;
          width: 90%;
        }

        .stats {
          font-size: 16px;
          margin-left: 15px;
        }

        .card-footer {
          padding-right: 40px;
        }
      }
      /* Container Splash Screen */
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000; /* Warna background gelap */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999; /* Memastikan berada di paling depan */

        /* Menjalankan animasi: nama_animasi | durasi | delay | tipe_transisi | status_akhir */
        animation: fadeOutSplash 0.8s ease-in-out 1s forwards;
        pointer-events: none; /* Biar user bisa klik menu di bawahnya setelah hilang */
      }

      /* Ukuran Logo */
      .splash-logo {
        max-width: 500px; /* Atur lebar maksimal logo kamu */
        height: auto;
        /* Animasi opsional: membuat logo sedikit membesar saat muncul */
        animation: scaleUp 0.9s ease-out;
      }

      /* KEYFRAMES ANIMASI */

      /* 1. Animasi Menghilang (Fade Out) untuk Background */
      @keyframes fadeOutSplash {
        0% {
          opacity: 1;
          visibility: visible;
        }
        99% {
          opacity: 0;
          visibility: visible;
        }
        100% {
          opacity: 0;
          visibility: hidden; /* Benar-benar hilang dari layar */
          display: none;
        }
      }

      /* 2. Animasi Logo Efek Pop-up Ringan */
      @keyframes scaleUp {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
